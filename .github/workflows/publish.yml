name: Publish

# Releases are tag-driven. Bump the version with `uv run --locked --extra dev hatch version patch`, commit,
# then push a tag that matches it:
#
#   uv run --locked --extra dev hatch version patch && git commit -am "Release 0.1.1" && git tag v0.1.1 && git push --follow-tags
#
# Publishing uses PyPI trusted publishing, so there is no API token to store.
# Configure it once at https://pypi.org/manage/account/publishing/ with:
#   owner/repo = this repository, workflow = publish.yml, environment = pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
          enable-cache: false

      - name: Check the lockfile
        run: uv lock --check

      - name: Install the project environment
        run: uv sync --locked --extra dev

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --locked --extra dev hatch version)
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version"
          echo "tag:             $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($version). Run 'uv run --locked --extra dev hatch version' and retag."
            exit 1
          fi

      - name: Run tests
        run: uv run --locked --extra dev pytest -q

      - name: Export locked build constraints
        run: uv export --locked --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/build-constraints.txt" > /dev/null

      - name: Build
        run: uv build --build-constraint "$RUNNER_TEMP/build-constraints.txt" --require-hashes --out-dir dist --no-create-gitignore

      - name: Check metadata
        run: uv run --locked --extra dev twine check dist/*

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/msteams-transcripts
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    # A manual production publish must be dispatched against an existing tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msteams-transcripts
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Create the GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distributions
          path: dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
