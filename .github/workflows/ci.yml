name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile
        run: uv lock --check

      - name: Install
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run --locked --extra dev ruff format --check .

      - name: Lint
        run: uv run --locked --extra dev ruff check .

      - name: Type check
        run: uv run --locked --extra dev ty check src

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            uv_checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
          - os: ubuntu-latest
            python: "3.13"
            uv_checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
          - os: windows-latest
            python: "3.10"
            uv_checksum: "ace861f360c6de2babedc1607d0f454b6b09a820dbc8182dc15af927e4df9589"
          - os: windows-latest
            python: "3.13"
            uv_checksum: "ace861f360c6de2babedc1607d0f454b6b09a820dbc8182dc15af927e4df9589"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          checksum: ${{ matrix.uv_checksum }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile
        run: uv lock --check

      - name: Install
        run: uv sync --locked --extra dev

      - name: Test
        run: uv run --locked --extra dev pytest -q

      - name: Check the command line starts
        run: uv run --locked --extra dev msteams-transcripts --version

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the lockfile
        run: uv lock --check

      - name: Install the project environment
        run: uv sync --locked --extra dev

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Export locked build constraints
        run: uv export --locked --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/build-constraints.txt" > /dev/null

      - name: Build
        run: uv build --build-constraint "$RUNNER_TEMP/build-constraints.txt" --require-hashes --out-dir dist --no-create-gitignore

      - name: Check metadata
        run: uv run --locked --extra dev twine check dist/*

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: distributions
          path: dist/
